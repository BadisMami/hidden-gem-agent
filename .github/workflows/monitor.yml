name: Monitor (every 4 hours, all companies)

on:
  schedule:
    # Every 4 hours around the clock, at :17 past (GitHub drops far more
    # runs scheduled exactly on the hour). UTC 2,6,10,14,18,22 = 10pm,
    # 2am, 6am, 10am, 2pm, 6pm EDT (an hour earlier in EST). Overnight
    # runs still scan and record new postings, but texts are held until
    # 8am Eastern by the texting window in internship_monitor_service.py -
    # that check, not this cron, is what enforces quiet hours.
    - cron: "17 2,6,10,14,18,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (with OS deps)
        run: playwright install --with-deps chromium

      - name: Run full monitor (all companies, including custom scraper)
        env:
          EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NOTIFICATION_PHONE_NUMBER: ${{ secrets.NOTIFICATION_PHONE_NUMBER }}
          SMS_CARRIER_GATEWAY: ${{ secrets.SMS_CARRIER_GATEWAY }}
        run: python src/internship_monitor_service.py

      - name: Commit and push database changes (only if something changed)
        run: |
          git config user.name "hidden-gem-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database/internship_agent.db
          git diff --cached --quiet && exit 0
          git commit -m "Monitor run: update internship database [skip ci]"
          git pull --rebase origin main
          git push
